name: CC 20.00-24.00 

on:
  schedule:
    - cron: '00 08 * * *' # เริ่มรัน 20:00 น. ทุกวัน (เวลาไทย / 13:30 UTC)
  workflow_dispatch:

jobs:
  record_and_upload:
    runs-on: ubuntu-latest
    # แนะนำให้เพิ่ม timeout เผื่อสคริปต์ค้าง (210 นาที + เวลาเผื่ออัปโหลด 15 นาที)
    timeout-minutes: 225 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 🎬 ติดตั้ง FFmpeg สำหรับอัด แปลง และรวมเสียง
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # ⚡ ติดตั้ง Library ของ Python
      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install google-genai edge-tts

      # 🎙️ รันโปรแกรมบันทึกเสียง (ต้องตั้งให้หยุดอัดเมื่อครบ 210 นาทีในไฟล์นี้)
      - name: Run Recorder Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python recorder.py

      # 🔗 ตรวจสอบและรวมไฟล์ MP3 ให้เป็นไฟล์เดียว (หากมีการตัดแบ่งไฟล์มา)
      - name: Merge MP3 files
        run: |
          mp3_count=$(ls -1 *.mp3 2>/dev/null | wc -l)
          
          if [ "$mp3_count" -gt 1 ]; then
            echo "=== พบไฟล์ MP3 จำนวน $mp3_count ไฟล์ เริ่มทำการรวมเป็นไฟล์เดียว ==="
            
            # สร้าง list ชื่อไฟล์ เรียงตามตัวเลขและตัวอักษร (-v) เพื่อให้ ffmpeg อ่าน
            ls -v *.mp3 | while read -r file; do echo "file '$file'" >> mp3_list.txt; done
            
            # กำหนดชื่อไฟล์รวม
            OUTPUT_NAME="Combined_CC_20.00-24.00_$(TZ='Asia/Bangkok' date +'%Y-%m-%d').mp3"
            
            # รวมไฟล์เข้าด้วยกันโดยไม่ลดคุณภาพ (copy stream)
            ffmpeg -f concat -safe 0 -i mp3_list.txt -c copy "$OUTPUT_NAME"
            
            # ย้ายไฟล์ย่อย (Chunks) ทั้งหมดไปเก็บในโฟลเดอร์ raw_chunks เพื่อไม่ให้รบกวนตอนอัปโหลด
            mkdir -p raw_chunks
            mv *.mp3 raw_chunks/ 2>/dev/null || true
            
            # ย้ายไฟล์รวมที่สำเร็จแล้วกลับมาเตรียมอัปโหลดเพียงไฟล์เดียว
            mv "raw_chunks/$OUTPUT_NAME" ./
            
            echo "=== รวมไฟล์เสร็จสิ้น ได้ไฟล์: $OUTPUT_NAME ==="
          elif [ "$mp3_count" -eq 1 ]; then
            echo "=== มีไฟล์ MP3 เพียงไฟล์เดียว ไม่จำเป็นต้องรวมไฟล์ ==="
          else
            echo "=== ไม่พบไฟล์ MP3 สำหรับอัปโหลด ==="
          fi

      # ☁️ ติดตั้ง Rclone
      - name: Install Rclone
        run: |
          sudo -v ; curl https://rclone.org/install.sh | sudo bash

      # 📤 อัปโหลดเข้า Google Drive
      - name: Setup Rclone and Upload
        env:
          RCLONE_CONF_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF_DATA" > ~/.config/rclone/rclone.conf
          
          # เปลี่ยน Path สร้างโฟลเดอร์ CC 20.00-24.00 ภายใต้ CNBC 
          TARGET_FOLDER="CNBC/CC 20.00-24.00/$(TZ='Asia/Bangkok' date +'%Y-%m-%d')"
          
          echo "=== กำลังอัปโหลดไฟล์เข้าโฟลเดอร์: $TARGET_FOLDER ==="
          
          # ใช้ copy แทน move เพื่อความปลอดภัยของไฟล์ และป้องกัน Error หากเซิร์ฟเวอร์สะดุดตอนลบไฟล์ทิ้ง
          rclone copy ./ "mydrive:$TARGET_FOLDER" --include "*.mp3" --include "*.txt" --verbose
